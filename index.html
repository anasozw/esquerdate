<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matchifesto 🇧🇷🇫🇷</title>
<meta name="description" content="Matchifesto: Brasileiros × Franceses. Deu match, descobre o @.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111111'/><path fill='%23c8102e' d='M50 80 44 74.6C25 57.4 14 47.4 14 35.4 14 25.4 21.8 18 31.6 18c5.6 0 11 2.6 14.4 6.7C49.6 20.6 55 18 60.6 18 70.4 18 78 25.4 78 35.4c0 12-11 22-30 39.2z' transform='translate(4 2)'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one centered phone-width column; a stacked deck of cards is the whole app */
:root{
  --bg:#efe4cc; --surface:#f8f1e0; --fg:#111111; --muted:#5e554a;
  --bleu:#2c3fd6; --verde:#0d8a52; --ouro:#f2b705; --rouge:#c8102e; --line:#d6c7a8;
  --display:"Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120e; --surface:#221d17; --fg:#efe4cc; --muted:#b3a68f;
  --bleu:#7f8cff; --verde:#3ccf8e; --ouro:#ffd23f; --rouge:#ef3e55; --line:#3a3128; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120e; --surface:#221d17; --fg:#efe4cc; --muted:#b3a68f;
  --bleu:#7f8cff; --verde:#3ccf8e; --ouro:#ffd23f; --rouge:#ef3e55; --line:#3a3128; color-scheme:dark}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:420px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;flex:none}
.logo{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:.88;text-transform:uppercase;display:flex;flex-direction:column;transform:rotate(-4deg);transform-origin:left center}
.logo .r{color:var(--rouge)}
.slogan{font:700 .8rem var(--body);letter-spacing:.08em;text-align:center;color:var(--fg);margin:0}
.tag{font-size:.78rem;color:var(--muted);margin-top:3px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;color:var(--muted);font:700 .78rem var(--body);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.deck{position:relative;height:440px;max-width:100%}
.card{position:absolute;inset:0;background:var(--surface);border-radius:24px;border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(20,15,50,.12);display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;transition:transform .25s ease}
.card.back{transform:scale(.95) translateY(14px);opacity:.7}
.band{height:150px;display:flex;align-items:flex-end;padding:16px;color:#fff;position:relative}
.band.br{background:linear-gradient(135deg,#0d9b5c 0 60%,#f2b705 60% 100%)}
.band.fr{background:linear-gradient(90deg,#2c3fd6 0 33%,#f4f1ff 33% 66%,#e0314b 66%)}
.initial{width:76px;height:76px;border-radius:50%;background:var(--surface);color:var(--fg);display:grid;place-items:center;
  font:800 2rem var(--display);border:4px solid var(--surface);position:absolute;bottom:-38px;left:16px}
.flag{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700}
.info{padding:48px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.name{font:800 1.6rem var(--display);letter-spacing:-.02em;text-wrap:balance}
.name small{font-weight:500;color:var(--muted);font-size:1.1rem}
.meta{color:var(--muted);font-size:.9rem}
.bio{font-size:1rem;line-height:1.45;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.75rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.stamp{position:absolute;top:24px;font:800 1.8rem var(--display);padding:4px 12px;border:4px solid;border-radius:10px;opacity:0;pointer-events:none}
.stamp.like{left:20px;color:var(--verde);transform:rotate(-12deg)}
.stamp.nope{right:20px;color:var(--rouge);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;gap:28px}
.round{width:68px;height:68px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.8rem;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.round:active{transform:scale(.92)}
.round.no{color:var(--rouge)} .round.yes{color:var(--verde)}
.round:disabled{opacity:.4;cursor:default}
.empty{position:absolute;inset:0;border:2px dashed var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;color:var(--muted)}
.empty h3{font:800 1.3rem var(--display);color:var(--fg);margin:0;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font:800 1.4rem var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.panel p{margin:0;color:var(--muted);line-height:1.45}
label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:700}
input,textarea,select{font:400 1rem var(--body);padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-weight:700;font-size:1rem;cursor:pointer}
.pick button[aria-pressed="true"]{border-color:var(--bleu);background:var(--surface)}
.primary{background:var(--fg);color:var(--bg);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer}
.err{color:var(--rouge);font-size:.88rem;min-height:1em}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.reveal{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.handle{font:800 1.5rem var(--display);color:var(--rouge);overflow-wrap:anywhere;user-select:text}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.li div{min-width:0;overflow-wrap:anywhere}
.li b{display:block}
.overlay{position:fixed;inset:0;background:rgba(10,8,25,.55);display:grid;place-items:center;padding:16px;z-index:20}
.overlay .panel{max-width:380px;width:100%;box-sizing:border-box}
.foot{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.4}
@media (prefers-reduced-motion:reduce){.card,.round{transition:none}}
.deck{height:520px}
.band.has-photo{height:300px;padding:0;background:#222}
.band .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.band.has-photo .flag{z-index:1}
.band.has-photo + .info{padding-top:14px}
.photo-pick{display:flex;align-items:center;gap:14px}
.ph-prev{width:84px;height:84px;border-radius:18px;background:var(--bg);border:1px dashed var(--line);display:grid;place-items:center;font-size:1.8rem;overflow:hidden;flex:none}
.ph-prev img{width:100%;height:100%;object-fit:cover}
.ph-btn{display:inline-flex;align-items:center;font-size:.95rem}
.tipbtn{align-self:center;background:none;border:0;color:var(--muted);font:700 .9rem var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px}
.tipbox{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;box-sizing:border-box}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="var(--fg)"/><path fill="var(--rouge)" transform="translate(4 2)" d="M50 80 44 74.6C25 57.4 14 47.4 14 35.4 14 25.4 21.8 18 31.6 18c5.6 0 11 2.6 14.4 6.7C49.6 20.6 55 18 60.6 18 70.4 18 78 25.4 78 35.4c0 12-11 22-30 39.2z"/></svg>
      <div class="logo" aria-label="Matchifesto"><span>Match</span><span class="r">ifesto</span></div></div>
      <div class="tag" data-t="tag"></div>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Langue">
      <button id="lang-pt" aria-pressed="true">PT</button>
      <button id="lang-fr" aria-pressed="false">FR</button>
    </div>
  </header>
  <main id="view"></main>
  <p class="foot" data-t="foot"></p>
  <p class="slogan">Make love, not fachos</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
